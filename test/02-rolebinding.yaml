apiVersion: v1
kind: ServiceAccount
metadata:
  name: dirtyfrag-test
  namespace: dirtyfrag-test
  annotations:
    kubernetes.io/description: Testing DirtyFrag vulnerability.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:privileged
  namespace: dirtyfrag-test
  annotations:
    kubernetes.io/description: Testing DirtyFrag vulnerability.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
- kind: ServiceAccount
  name: dirtyfrag-test
  namespace: dirtyfrag-test
