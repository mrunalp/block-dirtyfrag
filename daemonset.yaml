---
apiVersion: v1
kind: Namespace
metadata:
  name: dirtyfrag-mitigation-ebpf
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    kubernetes.io/description: Mitigating DirtyFrag (xfrm-ESP + rxrpc/rxkad page-cache write) with an eBPF DaemonSet.  This is a temporary workaround until the cluster can be updated to pick up a patched kernel.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:privileged
  namespace: dirtyfrag-mitigation-ebpf
  annotations:
    kubernetes.io/description: Mitigating DirtyFrag with an eBPF DaemonSet.  This is a temporary workaround until the cluster can be updated to pick up a patched kernel.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
- kind: ServiceAccount
  name: default
  namespace: dirtyfrag-mitigation-ebpf
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dirtyfrag-mitigation-ebpf
  namespace: dirtyfrag-mitigation-ebpf
  labels:
    app: block-dirtyfrag
  annotations:
    kubernetes.io/description: Mitigating DirtyFrag with an eBPF DaemonSet.  This is a temporary workaround until the cluster can be updated to pick up a patched kernel.
spec:
  selector:
    matchLabels:
      app: block-dirtyfrag
  template:
    metadata:
      labels:
        app: block-dirtyfrag
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: NotIn
                values:
                - arm64
                - ppc64le
                - s390x
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      priorityClassName: system-node-critical
      tolerations:
      - operator: Exists
      containers:
      - name: blocker
        image: quay.io/mrunalp/block-dirtyfrag:latest
        securityContext:
          privileged: true
        volumeMounts:
        - name: bpf
          mountPath: /sys/fs/bpf
        - name: btf
          mountPath: /sys/kernel/btf/vmlinux
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: bpf
        hostPath:
          path: /sys/fs/bpf
          type: DirectoryOrCreate
      - name: btf
        hostPath:
          path: /sys/kernel/btf/vmlinux
          type: File
      terminationGracePeriodSeconds: 5
